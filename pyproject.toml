[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "separation"
version = "0.1.0"
description = "Alat bantu studio sablon kaos: separasi warna, film, underbase, HPP"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
separation = "separation.cli:main"

[tool.setuptools]
packages = ["separation"]
